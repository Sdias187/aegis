# =============================================================================
# AEGIS - Nginx Configuration
# =============================================================================
# SPA (Single Page Application) com suporte a rotas client-side
# Headers de segurança
# Compressão gzip
# Cache de arquivos estáticos
# Proxy reverso para API backend
# Healthcheck
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # =========================================================================
    # Root directory
    # =========================================================================
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (single-line para evitar newlines no header HTTP)
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${API_URL}; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    add_header Content-Security-Policy $csp always;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
    gzip_proxied any;
    gzip_vary on;

    # =========================================================================
    # Healthcheck
    # =========================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header Cache-Control no-store;
    }

    # =========================================================================
    # API Proxy — redireciona chamadas /api/* para o backend
    # =========================================================================
    location /api/ {
        proxy_pass http://aegis-api:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # Static Assets (com cache)
    # =========================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================================================================
    # Service Worker (sem cache para poder atualizar)
    # =========================================================================
    location /sw.js {
        expires -1;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # =========================================================================
    # SPA Fallback
    # =========================================================================
    # Todas as rotas que não correspondem a arquivos estáticos
    # são redirecionadas para o index.html (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;

        # Não cachear o HTML principal
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # =========================================================================
    # Deny access to hidden files
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
